import java.security.MessageDigest

pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}
rootProject.name = "MinecraftC"
include(":app")

def sdlVersion = "3.4.10"
def dependencyRoot = file(".deps")
def archive = new File(dependencyRoot, "SDL3-${sdlVersion}.zip")
def sourceRoot = new File(dependencyRoot, "SDL3-${sdlVersion}")
def expectedSha256 = "be8dafef3ecc956e736cfd1c242c10737f3ad589a866f25ba437b7f2f6d5ced2"
if (!new File(sourceRoot, "CMakeLists.txt").isFile()) {
    dependencyRoot.mkdirs()
    if (!archive.isFile()) {
        new URL("https://github.com/libsdl-org/SDL/releases/download/release-${sdlVersion}/SDL3-${sdlVersion}.zip").withInputStream { input ->
            archive.withOutputStream { output -> output << input }
        }
    }
    def digest = MessageDigest.getInstance("SHA-256")
    archive.withInputStream { input ->
        byte[] buffer = new byte[65536]
        for (int count = input.read(buffer); count >= 0; count = input.read(buffer))
            if (count > 0) digest.update(buffer, 0, count)
    }
    def actual = digest.digest().encodeHex().toString()
    if (actual != expectedSha256)
        throw new GradleException("SDL archive checksum mismatch: ${actual}")
    copy { from zipTree(archive); into dependencyRoot }
}
gradle.ext.sdlSourceDir = sourceRoot
