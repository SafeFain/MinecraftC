plugins { id "com.android.application" }

def repositoryRoot = rootProject.projectDir.parentFile
def cmakeText = new File(repositoryRoot, "CMakeLists.txt").getText("UTF-8")
def versionMatch = cmakeText =~ /project\(MinecraftC VERSION (\d+)\.(\d+)\.(\d+)/
if (!versionMatch.find()) throw new GradleException("Cannot read MinecraftC version")
def versionMajor = versionMatch.group(1).toInteger()
def versionMinor = versionMatch.group(2).toInteger()
def versionPatch = versionMatch.group(3).toInteger()

android {
    namespace "io.github.safefain.minecraftc"
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "28.2.13676358"
    defaultConfig {
        applicationId "io.github.SafeFain.MinecraftC"
        minSdk 29
        targetSdk 35
        versionCode versionMajor * 10000 + versionMinor * 100 + versionPatch
        versionName "${versionMajor}.${versionMinor}.${versionPatch}"
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-29", "-DANDROID_STL=c++_shared",
                          "-DBUILD_TESTING=OFF", "-DMINECRAFTC_FETCH_DEPENDENCIES=ON",
                          "-DFETCHCONTENT_SOURCE_DIR_SDL3=${gradle.ext.sdlSourceDir.absolutePath}"
                cppFlags "-std=c++17"
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    sourceSets {
        main {
            assets.srcDirs = [new File(repositoryRoot, "assets")]
            java.srcDirs += new File(gradle.ext.sdlSourceDir, "android-project/app/src/main/java")
        }
    }
    externalNativeBuild {
        cmake {
            path new File(repositoryRoot, "CMakeLists.txt")
            version "3.22.1"
        }
    }
}
