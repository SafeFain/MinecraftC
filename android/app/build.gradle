plugins { id "com.android.application" }

def repositoryRoot = rootProject.projectDir.parentFile
def versionText = new File(repositoryRoot, "VERSION").getText("UTF-8").trim()
def versionMatch = versionText =~ /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(alpha|beta|rc|release)(?:\.([1-9][0-9]*))?$/
if (!versionMatch.find()) throw new GradleException("Cannot read MinecraftC version")
def versionMajor = versionMatch.group(1).toBigInteger()
def versionMinor = versionMatch.group(2).toBigInteger()
def versionPatch = versionMatch.group(3).toBigInteger()
def versionChannel = versionMatch.group(4).toString()
def iterationText = versionMatch.group(5)
def versionIteration = iterationText == null ? 0 : iterationText.toBigInteger()
if (versionChannel == "release" && iterationText != null) {
    throw new GradleException("Release versions cannot have a prerelease iteration")
}
if (versionIteration > 999 || versionMajor > 20 || versionMinor > 99 || versionPatch > 99) {
    throw new GradleException("Version exceeds supported mobile ranges: major <= 20, minor/patch <= 99, iteration 1..999")
}
def channelNumber
switch (versionChannel) {
    case "alpha": channelNumber = 1; break
    case "beta": channelNumber = 2; break
    case "rc": channelNumber = 3; break
    case "release": channelNumber = 4; break
    default: throw new GradleException("Unsupported MinecraftC version channel: ${versionChannel}")
}
def versionCodeValue =
        (versionMajor * 10000 + versionMinor * 100 + versionPatch) * 10000 + channelNumber * 1000 + versionIteration
if (versionCodeValue > 2100000000) {
    throw new GradleException("Version code exceeds Android's 2100000000 limit")
}
def androidVersionCode = versionCodeValue.toInteger()
def generatedLegalAssetsDir = layout.buildDirectory.dir("generated/legalAssets").get().asFile
def contentPackageRoots = (findProperty("minecraftcContentPackages") ?: "").toString()
        .split(";").findAll { !it.isEmpty() }.collect { file(it).canonicalFile }
def contentPackagePaths = contentPackageRoots.collect { it.path.replace('\\', '/') }.join(";")
def generatedContentAssetsDir = layout.buildDirectory.dir("generated/contentAssets").get().asFile
def contentStagingDir = layout.buildDirectory.dir("contentPackageStaging").get().asFile

tasks.register("prepareContentAssets") {
    inputs.files(contentPackageRoots)
    inputs.file(new File(repositoryRoot, "tools/content_package.py"))
    inputs.property("packagePaths", contentPackagePaths)
    outputs.dir(generatedContentAssetsDir)
    // Staging must run before Sync discovers sources; a Sync task with missing
    // first-build sources would skip doFirst entirely. Also sync an empty set
    // when roots are removed so stale packages cannot enter the next APK.
    doLast {
        def staged = []
        contentPackageRoots.each { root ->
            def id = new groovy.json.JsonSlurper().parse(new File(root, "mod.json")).id
            if (!(id ==~ /[a-z0-9_.-]+/) || id == "." || id == "..") {
                throw new GradleException("Invalid content package id")
            }
            project.exec {
                commandLine (findProperty("minecraftcPython") ?: "python3"),
                        new File(repositoryRoot, "tools/content_package.py"), "stage", root,
                        "--output", new File(contentStagingDir, id), "--refresh"
            }
            staged.add([id: id, directory: new File(contentStagingDir, id)])
        }
        project.sync {
            into generatedContentAssetsDir
            staged.each { entry ->
                from(entry.directory) { into "plugins/${entry.id}" }
            }
        }
    }
}

tasks.register("prepareLegalAssets", Sync) {
    from new File(repositoryRoot, "LICENSE")
    into generatedLegalAssetsDir
}

android {
    namespace "io.github.safefain.minecraftc"
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "28.2.13676358"
    defaultConfig {
        applicationId "io.github.SafeFain.MinecraftC"
        minSdk 29
        targetSdk 35
        versionCode androidVersionCode
        versionName versionText
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-29", "-DANDROID_STL=c++_shared",
                          "-DBUILD_TESTING=OFF", "-DMINECRAFTC_FETCH_DEPENDENCIES=ON",
                          "-DFETCHCONTENT_SOURCE_DIR_SDL3=${gradle.ext.sdlSourceDir.absolutePath}"
                if (!contentPackageRoots.isEmpty()) {
                    arguments "-DMINECRAFTC_CONTENT_PACKAGES=${contentPackagePaths}"
                    if (findProperty("minecraftcPython")) {
                        arguments "-DPython3_EXECUTABLE=${findProperty('minecraftcPython')}"
                    }
                }
                cppFlags "-std=c++17"
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    sourceSets {
        main {
            assets.srcDirs = [new File(repositoryRoot, "assets"), generatedLegalAssetsDir, generatedContentAssetsDir]
            java.srcDirs += new File(gradle.ext.sdlSourceDir, "android-project/app/src/main/java")
        }
    }
    externalNativeBuild {
        cmake {
            path new File(repositoryRoot, "CMakeLists.txt")
            version "3.22.1"
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn tasks.named("prepareLegalAssets")
    dependsOn tasks.named("prepareContentAssets")
}
