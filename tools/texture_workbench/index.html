<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MinecraftC 材质工作台</title><link rel="stylesheet" href="/style.css">
<body><header><span class="mark">M</span><div><h1>材质工作台 <small>v5</small></h1><p>组合结构，探索变体，让像素动起来。</p></div><div id="status" role="status">正在加载…</div></header>
<main><aside><label>材质 <select id="material"></select></label><label>种子 <input id="seed" type="text" value="213785369"></label><div class="row"><label>变体数 <input id="variants" type="number" min="1" max="4"></label><label>预览变体 <select id="variant"></select></label></div><div class="row"><label>帧数 <input id="frames" type="number" min="1" max="16"></label><label>帧率 <input id="fps" type="number" min="0" max="60"></label></div><label>配方 <select id="recipe"></select></label><label>图层 <select id="layer"></select></label><div class="row"><label>密度 <input id="density" type="number" min="0" max="1" step=".01"></label><label>尺度 <input id="scale" type="number" min=".25" max="16" step=".25"></label></div><div class="row"><label>角色 <input id="role" type="number" min="0" max="15"></label><label>图层种子 <input id="layerSeed" type="number" value="0"></label></div><label>角色颜色 <input id="color" type="color"></label><details><summary>配方 JSON</summary><textarea id="layers" spellcheck="false"></textarea><button id="applyLayers">应用图层</button></details><div class="row"><button id="refresh" class="primary">生成预览</button><button id="lock">锁定候选</button></div><p id="locked"></p></aside>
<section><div class="toolbar"><label>视图 <select id="view"><option value="cube">立方体</option><option value="wall">铺墙</option><option value="flat">贴图</option></select></label><label>通道 <select id="channel"><option value="pixels">颜色</option><option value="normal">法线</option><option value="property">属性</option><option value="height">高度</option></select></label><label>光照 <select id="light"><option value="day">日间</option><option value="dusk">黄昏</option><option value="cave">洞穴</option></select></label></div><div class="stage"><canvas id="preview" width="760" height="520" aria-label="材质三维预览，拖动可旋转"></canvas><p id="fallback" hidden>此浏览器无法使用 WebGL2，二维贴图与导出仍可使用。</p></div><div class="transport"><button id="play">暂停</button><label>帧 <input id="frame" type="range" min="0" max="0" value="0"></label><output id="frameLabel">0 / 1</output></div><div class="swatches"><div><h2>原尺寸</h2><canvas id="native" width="16" height="16"></canvas></div><div><h2>像素放大</h2><canvas id="large" width="192" height="192"></canvas></div><div><h2>语义遮罩</h2><select id="mask"></select><canvas id="maskCanvas" width="192" height="192"></canvas></div></div><p class="note">工作台光照用于创作预览。正式游戏效果以 Vulkan 核验为准。</p></section>
</main><footer><span>草稿独立保存 · 导出可复现 · CC0 原创程序材质</span><button id="save">保存草稿</button><button id="export">导出材质包</button><button id="apply">应用到正式资产</button></footer><script src="/workbench.js"></script></body></html>
