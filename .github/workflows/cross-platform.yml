name: Cross-platform build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate version and release tag
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(alpha|beta|rc|release)$ ]]; then
            echo "Invalid VERSION: $version" >&2
            exit 1
          fi
          channel="${BASH_REMATCH[2]}"
          release_tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "$release_tag" ]]; then
            echo "Release tag '$GITHUB_REF_NAME' must exactly match VERSION as '$release_tag'" >&2
            exit 1
          fi
          prerelease=true
          if [[ "$channel" == release ]]; then prerelease=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Read project version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(alpha|beta|rc|release)$ ]]
          core="${BASH_REMATCH[1]}"
          channel="${BASH_REMATCH[2]}"
          case "$channel" in alpha) label=Alpha;; beta) label=Beta;; rc) label=RC;; release) label=Release;; esac
          echo "MINECRAFTC_VERSION=$version" >> "$GITHUB_ENV"
          echo "MINECRAFTC_VERSION_CORE=$core" >> "$GITHUB_ENV"
          echo "MINECRAFTC_VERSION_DISPLAY=$label-$core" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=MinecraftC-$version" >> "$GITHUB_ENV"
      - name: Install graphics and virtual-display dependencies
        run: sudo apt-get update && sudo apt-get install -y glslc libvulkan-dev mesa-vulkan-drivers xorg-dev xvfb libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules
      - name: Configure
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DMINECRAFTC_FETCH_DEPENDENCIES=ON -DMINECRAFTC_PORTABLE_LAYOUT=ON -DCMAKE_INSTALL_MESSAGE=NEVER
      - name: Build
        run: cmake --build build-ci -j2
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure
      - name: Verify checked-in Vulkan shaders
        run: python3 tools/vulkan_shaders.py --root . --check
      - name: Install
        run: cmake --install build-ci --prefix "$RUNNER_TEMP/$RELEASE_DIR"
      - name: Verify installed assets
        run: |
          test -f "$RUNNER_TEMP/$RELEASE_DIR/LICENSE"
          test -f "$RUNNER_TEMP/$RELEASE_DIR/assets/textures/generated/atlas.json"
          test -f "$RUNNER_TEMP/$RELEASE_DIR/assets/textures/generated/items_atlas.png"
          test -f "$RUNNER_TEMP/$RELEASE_DIR/assets/textures/generated/cloud.png"
          test -f "$RUNNER_TEMP/$RELEASE_DIR/assets/shaders/vulkan/chunk.vert.spv"
          test -f "$RUNNER_TEMP/$RELEASE_DIR/share/applications/io.github.SafeFain.MinecraftC.desktop"
          test -f "$RUNNER_TEMP/$RELEASE_DIR/share/icons/hicolor/1024x1024/apps/minecraftc.png"
          test "$($RUNNER_TEMP/$RELEASE_DIR/minecraftc --version)" = "MinecraftC $MINECRAFTC_VERSION_DISPLAY"
          ! ldd "$RUNNER_TEMP/$RELEASE_DIR/minecraftc" | grep -E 'lib(GL|GLES|EGL)'
          ! nm -C "$RUNNER_TEMP/$RELEASE_DIR/minecraftc" | grep -E 'OpenGLRenderer|gladLoad'
      - name: Verify installed renderer startup
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          run_smoke() {
            renderer="$1"
            expected="$2"
            log="$RUNNER_TEMP/minecraftc-$renderer-smoke.log"
            timeout 45s xvfb-run -a "$RUNNER_TEMP/$RELEASE_DIR/minecraftc" \
              "--renderer=$renderer" > "$log" 2>&1 &
            pid=$!
            found=0
            for _ in {1..45}; do
              if grep -Fq "$expected" "$log"; then
                found=1
                break
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            kill "$pid" 2>/dev/null || true
            set +e
            wait "$pid" 2>/dev/null
            status=$?
            set -e
            cat "$log"
            if test "$found" -ne 1; then
              echo "$renderer smoke test did not reach '$expected' (status $status)" >&2
              exit 1
            fi
          }
          run_smoke vulkan "Vulkan first frame presented"
          run_smoke vulkan-demo "Vulkan first frame presented"
      - name: Package Linux release
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/MinecraftC-$MINECRAFTC_VERSION-linux-x86_64.tar.gz" "$RELEASE_DIR"
      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: minecraftc-linux-x86_64
          path: ${{ runner.temp }}/MinecraftC-${{ env.MINECRAFTC_VERSION }}-linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Read project version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^(\d+\.\d+\.\d+)-(alpha|beta|rc|release)$') {
            throw "Invalid VERSION: $version"
          }
          $core = $Matches[1]
          $labels = @{ alpha = 'Alpha'; beta = 'Beta'; rc = 'RC'; release = 'Release' }
          $display = "$($labels[$Matches[2]])-$core"
          "MINECRAFTC_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MINECRAFTC_VERSION_CORE=$core" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MINECRAFTC_VERSION_DISPLAY=$display" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_DIR=MinecraftC-$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install pinned Vulkan SDK
        shell: pwsh
        run: |
          $version = "1.4.350.0"
          $expected = "855b27ba05d2d8119c5114c5d4ff870ca38f2c632b11e1bb9923b9b7e6ecfe7b"
          $installer = "$env:RUNNER_TEMP/vulkan_sdk.exe"
          $sdk = "$env:RUNNER_TEMP/VulkanSDK/$version"
          Invoke-WebRequest `
            -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe" `
            -OutFile $installer
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Vulkan SDK checksum mismatch: $actual"
          }
          & $installer --root $sdk --accept-licenses --default-answer `
            --confirm-command install copy_only=1
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK installation failed with exit code $LASTEXITCODE"
          }
          if (!(Test-Path "$sdk/Include/vulkan/vulkan.h") -or
              !(Test-Path "$sdk/Lib/vulkan-1.lib")) {
            throw "Vulkan SDK headers or import library are missing"
          }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdk/Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Configure
        run: cmake -S . -B build-ci -DMINECRAFTC_FETCH_DEPENDENCIES=ON -DMINECRAFTC_PORTABLE_LAYOUT=ON -DMINECRAFTC_STATIC_MSVC_RUNTIME=ON -DCMAKE_INSTALL_MESSAGE=NEVER
      - name: Build
        run: cmake --build build-ci --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build-ci -C Release --output-on-failure
      - name: Verify checked-in Vulkan shaders
        run: python tools/vulkan_shaders.py --root . --check
      - name: Install and verify layout
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/$env:RELEASE_DIR"
          cmake --install build-ci --config Release --prefix $stage
          if (!(Test-Path "$stage/minecraftc.exe")) { throw "Executable was not installed" }
          if (!(Test-Path "$stage/LICENSE")) { throw "GPL license was not installed" }
          if (!(Test-Path "$stage/assets/shaders/vulkan/chunk.vert.spv")) { throw "Assets were not installed" }
          if (!(Test-Path "$stage/assets/textures/generated/atlas.json")) { throw "Block atlas was not installed" }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon("$stage/minecraftc.exe")
          if ($null -eq $icon -or $icon.Width -lt 32) { throw "Executable icon is missing" }
          $icon.Dispose()
          $version = & "$stage/minecraftc.exe" --version
          if ($version -ne "MinecraftC $env:MINECRAFTC_VERSION_DISPLAY") { throw "Version check failed: $version" }
          $help = (& "$stage/minecraftc.exe" --help 2>&1) -join "`n"
          if ($help -notmatch "renderer=vulkan\|vulkan-demo\|vulkan-textured-demo") {
            throw "Installed Windows executable does not advertise Vulkan renderer modes"
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if (!$dumpbin) { throw "dumpbin.exe was not found" }
          $dependencies = (& $dumpbin.FullName /dependents "$stage/minecraftc.exe" 2>&1) -join "`n"
          if ($dependencies -match "OPENGL32.dll") {
            throw "Installed Windows executable unexpectedly links OpenGL"
          }
      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path "$env:RUNNER_TEMP/$env:RELEASE_DIR" -DestinationPath "$env:RUNNER_TEMP/MinecraftC-$env:MINECRAFTC_VERSION-windows-x86_64.zip"
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: minecraftc-windows-x86_64
          path: ${{ runner.temp }}/MinecraftC-${{ env.MINECRAFTC_VERSION }}-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos-universal:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Read project version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(alpha|beta|rc|release)$ ]]
          core="${BASH_REMATCH[1]}"; channel="${BASH_REMATCH[2]}"
          case "$channel" in alpha) label=Alpha;; beta) label=Beta;; rc) label=RC;; release) label=Release;; esac
          echo "MINECRAFTC_VERSION=$version" >> "$GITHUB_ENV"
          echo "MINECRAFTC_VERSION_CORE=$core" >> "$GITHUB_ENV"
          echo "MINECRAFTC_VERSION_DISPLAY=$label-$core" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=MinecraftC-$version" >> "$GITHUB_ENV"
      - name: Install pinned MoltenVK and shader compiler
        shell: bash
        run: |
          archive="$RUNNER_TEMP/MoltenVK-macos-1.4.1.tar"
          root="$RUNNER_TEMP/moltenvk"
          curl -L --fail --silent --show-error \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.1/MoltenVK-macos.tar \
            -o "$archive"
          echo "5ea0c259df7ded9a275444820f09cced54d6e5a7c7a31d262de62a5cdb7e15cf  $archive" \
            | shasum -a 256 -c -
          mkdir -p "$root"
          tar -xf "$archive" -C "$root"
          test -f "$root/MoltenVK/MoltenVK/include/vulkan/vulkan.h"
          test -f "$root/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib"
          test -f "$root/MoltenVK/LICENSE"
          echo "MINECRAFTC_MOLTENVK_ROOT=$root/MoltenVK" >> "$GITHUB_ENV"
          # GitHub's macOS image may carry an unrelated untrusted AWS tap.
          # Do not broaden trust merely to install an official formula.
          brew untap aws/tap >/dev/null 2>&1 || true
          brew install shaderc
      - name: Configure universal build
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DMINECRAFTC_FETCH_DEPENDENCIES=ON -DMINECRAFTC_MOLTENVK_ROOT="$MINECRAFTC_MOLTENVK_ROOT" -DMINECRAFTC_PORTABLE_LAYOUT=ON -DCMAKE_INSTALL_MESSAGE=NEVER -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Build
        run: cmake --build build-ci -j2
      - name: Test native slice
        run: ctest --test-dir build-ci --output-on-failure
      - name: Verify checked-in Vulkan shaders
        run: python3 tools/vulkan_shaders.py --root . --check
      - name: Install and verify universal executable
        run: |
          cmake --install build-ci --prefix "$RUNNER_TEMP/$RELEASE_DIR"
          app="$RUNNER_TEMP/$RELEASE_DIR/MinecraftC.app"
          executable="$app/Contents/MacOS/MinecraftC"
          moltenvk="$app/Contents/Frameworks/libMoltenVK.dylib"
          lipo "$executable" -verify_arch arm64 x86_64
          lipo "$moltenvk" -verify_arch arm64 x86_64
          otool -L "$executable" | grep -q '@rpath/libMoltenVK.dylib'
          ! otool -L "$executable" | grep -E 'OpenGL|OpenGLES'
          test "$(defaults read "$app/Contents/Info" CFBundleIconFile)" = "minecraftc.icns"
          test -f "$app/Contents/Resources/minecraftc.icns"
          test -f "$app/Contents/Resources/assets/shaders/vulkan/chunk.vert.spv"
          test -f "$RUNNER_TEMP/$RELEASE_DIR/LICENSE"
          test -f "$RUNNER_TEMP/$RELEASE_DIR/licenses/MoltenVK-LICENSE.txt"
          test "$("$executable" --version)" = "MinecraftC $MINECRAFTC_VERSION_DISPLAY"
          "$executable" --help | grep -q 'renderer=vulkan|vulkan-demo|vulkan-textured-demo'
      - name: Verify installed Vulkan startup
        shell: bash
        run: |
          executable="$RUNNER_TEMP/$RELEASE_DIR/MinecraftC.app/Contents/MacOS/MinecraftC"
          run_smoke() {
            renderer="$1"
            expected="$2"
            log="$RUNNER_TEMP/minecraftc-$renderer-smoke.log"
            "$executable" "--renderer=$renderer" > "$log" 2>&1 &
            pid=$!
            found=0
            for _ in {1..12}; do
              if grep -q "$expected" "$log"; then found=1; break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            cat "$log"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            test "$found" -eq 1
          }
          run_smoke vulkan "Vulkan first frame presented"
      - name: Package macOS release
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/MinecraftC-$MINECRAFTC_VERSION-macos-universal.tar.gz" "$RELEASE_DIR"
      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: minecraftc-macos-universal
          path: ${{ runner.temp }}/MinecraftC-${{ env.MINECRAFTC_VERSION }}-macos-universal.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  ios-arm64:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Read project version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(alpha|beta|rc|release)$ ]]
          echo "MINECRAFTC_VERSION=$version" >> "$GITHUB_ENV"
          echo "MINECRAFTC_VERSION_CORE=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
      - name: Install pinned MoltenVK and shader compiler
        shell: bash
        run: |
          archive="$RUNNER_TEMP/MoltenVK-all-1.4.1.tar"
          root="$RUNNER_TEMP/moltenvk"
          curl -L --fail --silent --show-error \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.1/MoltenVK-all.tar \
            -o "$archive"
          echo "2c498bf8c98b88ba1e84c1f153403d4c1a8490c122d9e2a3df238b25d4e10557  $archive" \
            | shasum -a 256 -c -
          mkdir -p "$root"
          tar -xf "$archive" -C "$root"
          test -f "$root/MoltenVK/MoltenVK/include/vulkan/vulkan.h"
          test -f "$root/MoltenVK/MoltenVK/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"
          test -f "$root/MoltenVK/MoltenVK/static/MoltenVK.xcframework/ios-arm64_x86_64-simulator/libMoltenVK.a"
          test -f "$root/MoltenVK/LICENSE"
          echo "MINECRAFTC_MOLTENVK_ROOT=$root/MoltenVK" >> "$GITHUB_ENV"
          # GitHub's macOS image may carry an unrelated untrusted AWS tap.
          # Do not broaden trust merely to install an official formula.
          brew untap aws/tap >/dev/null 2>&1 || true
          brew install shaderc
      - name: Configure and build iOS Simulator
        run: |
          cmake -S . -B build-ios-simulator -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DMINECRAFTC_FETCH_DEPENDENCIES=ON \
            -DMINECRAFTC_MOLTENVK_ROOT="$MINECRAFTC_MOLTENVK_ROOT"
          cmake --build build-ios-simulator --config Release --parallel 2
      - name: Verify iOS Simulator bundle
        shell: bash
        run: |
          app="build-ios-simulator/Release-iphonesimulator/MinecraftC.app"
          binary="$app/MinecraftC"
          require_file() {
            test -f "$1" || { echo "Missing iOS bundle file: $1" >&2; exit 1; }
          }
          check_plist() {
            key="$1"
            expected="$2"
            actual="$(/usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist")"
            test "$actual" = "$expected" || {
              echo "Unexpected $key: expected '$expected', got '$actual'" >&2
              exit 1
            }
          }
          test -x "$binary" || { echo "Missing iOS executable: $binary" >&2; exit 1; }
          xcrun vtool -show-build "$binary" \
            > "$RUNNER_TEMP/minecraftc-ios-simulator-platform.txt"
          if ! grep -Eq '^[[:space:]]*platform[[:space:]]+IOSSIMULATOR[[:space:]]*$' \
            "$RUNNER_TEMP/minecraftc-ios-simulator-platform.txt"; then
            echo "Simulator executable is not marked for the iOS Simulator platform" >&2
            cat "$RUNNER_TEMP/minecraftc-ios-simulator-platform.txt" >&2
            exit 1
          fi
          require_file "$app/shaders/vulkan/chunk.vert.spv"
          require_file "$app/shaders/vulkan/chunk.frag.spv"
          require_file "$app/textures/generated/items_atlas.png"
          require_file "$app/LICENSE"
          require_file "$app/licenses/MoltenVK-LICENSE.txt"
          test ! -d "$app/Frameworks/MoltenVK.framework" || {
            echo "MoltenVK must be linked statically" >&2
            exit 1
          }
          check_plist CFBundleIdentifier io.github.SafeFain.MinecraftC
          check_plist CFBundleShortVersionString "$MINECRAFTC_VERSION_CORE"
          check_plist MinimumOSVersion 14.0
          check_plist UIDeviceFamily:0 1
          check_plist UIDeviceFamily:1 2
          otool -L "$binary" > "$RUNNER_TEMP/minecraftc-ios-libraries.txt"
          xcrun dyld_info -exports "$binary" \
            > "$RUNNER_TEMP/minecraftc-ios-exports.txt"
          nm "$binary" > "$RUNNER_TEMP/minecraftc-ios-all-symbols.txt"
          grep -q 'Metal.framework' "$RUNNER_TEMP/minecraftc-ios-libraries.txt" || {
            echo "MinecraftC is not linked to Metal.framework" >&2
            exit 1
          }
          if grep -q 'OpenGLES.framework' "$RUNNER_TEMP/minecraftc-ios-libraries.txt"; then
            echo "Vulkan-only iOS binary unexpectedly links OpenGLES.framework" >&2
            exit 1
          fi
          grep -q '_vkGetInstanceProcAddr$' \
            "$RUNNER_TEMP/minecraftc-ios-exports.txt" || {
            echo "Static MoltenVK entry point is not exported" >&2
            cat "$RUNNER_TEMP/minecraftc-ios-exports.txt" >&2
            exit 1
          }
          if grep -q 'OpenGLRenderer' "$RUNNER_TEMP/minecraftc-ios-all-symbols.txt"; then
            echo "Vulkan-only iOS binary contains OpenGL renderer symbols" >&2
            exit 1
          fi
      - name: Smoke-test Vulkan on iPhone and iPad simulators
        shell: bash
        run: |
          app="$PWD/build-ios-simulator/Release-iphonesimulator/MinecraftC.app"
          startup_timeout=300
          runtime="$(xcrun simctl list runtimes available -j | python3 -c \
            'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if ".iOS-" in x["identifier"] and x["isAvailable"]]; r.sort(key=lambda x:tuple(map(int,x["version"].split(".")))); print(r[-1]["identifier"])')"
          device_type() {
            prefix="$1"
            xcrun simctl list devicetypes -j | python3 -c \
              'import json,sys; p=sys.argv[1]; d=[x for x in json.load(sys.stdin)["devicetypes"] if x["name"].startswith(p)]; print(d[0]["identifier"])' \
              "$prefix"
          }
          run_smoke() {
            family="$1"
            type="$2"
            udid="$(xcrun simctl create "MinecraftC-$family" "$type" "$runtime")"
            log="$RUNNER_TEMP/minecraftc-ios-$family.log"
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$app"
            sleep 3
            xcrun simctl launch --console "$udid" io.github.SafeFain.MinecraftC \
              > "$log" 2>&1 &
            launch_pid=$!
            found=0
            launch_exited=0
            for ((elapsed = 1; elapsed <= startup_timeout; ++elapsed)); do
              if grep -q 'Vulkan first frame presented' "$log"; then
                found=1
                break
              fi
              if ! kill -0 "$launch_pid" 2>/dev/null; then
                launch_exited=1
                break
              fi
              if test $((elapsed % 15)) -eq 0; then
                echo "Waiting for $family Vulkan cold start (${elapsed}s/${startup_timeout}s)"
              fi
              sleep 1
            done
            kill "$launch_pid" 2>/dev/null || true
            set +e
            wait "$launch_pid" 2>/dev/null
            launch_status=$?
            set -e
            cat "$log"
            if test "$found" -ne 1; then
              if test "$launch_exited" -eq 1; then
                echo "$family simctl launch exited before the first frame (status $launch_status)" >&2
              else
                echo "$family Vulkan cold start exceeded $startup_timeout seconds" >&2
              fi
              echo "Simulator system log for failed $family launch:"
              xcrun simctl spawn "$udid" log show --style compact --last 6m \
                --predicate 'process == "MinecraftC"' || true
              echo "Recent MinecraftC crash reports:"
              find "$HOME/Library/Logs/DiagnosticReports" -type f \
                -name 'MinecraftC*' -mmin -5 -print -exec cat {} \; || true
            fi
            xcrun simctl terminate "$udid" io.github.SafeFain.MinecraftC || true
            xcrun simctl shutdown "$udid" || true
            xcrun simctl delete "$udid"
            test "$found" -eq 1
            grep -q 'MinecraftC initialized' "$log"
            if grep -q 'Descriptor sets binding resources using Metal argument buffers' "$log"; then
              echo "MoltenVK simulator argument-buffer workaround was not applied" >&2
              exit 1
            fi
          }
          run_smoke iphone "$(device_type iPhone)"
          run_smoke ipad "$(device_type iPad)"
      - name: Package unsigned arm64 device IPA
        shell: bash
        run: |
          cmake -S . -B build-ios-device -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DMINECRAFTC_FETCH_DEPENDENCIES=ON \
            -DMINECRAFTC_MOLTENVK_ROOT="$MINECRAFTC_MOLTENVK_ROOT"
          archive="$RUNNER_TEMP/MinecraftC-$MINECRAFTC_VERSION-ios-arm64-unsigned.xcarchive"
          build_settings="$RUNNER_TEMP/minecraftc-ios-device-build-settings.txt"
          xcodebuild -project build-ios-device/MinecraftC.xcodeproj \
            -target minecraftc -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -showBuildSettings CODE_SIGNING_ALLOWED=NO > "$build_settings"
          if ! grep -Eq '^[[:space:]]*SKIP_INSTALL = NO[[:space:]]*$' "$build_settings"; then
            echo "MinecraftC app target must set SKIP_INSTALL=NO" >&2
            grep -E 'SKIP_INSTALL|INSTALL_PATH|TARGET_BUILD_DIR' "$build_settings" >&2 || true
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*INSTALL_PATH = /Applications[[:space:]]*$' "$build_settings"; then
            echo "MinecraftC app target must install into /Applications" >&2
            grep -E 'SKIP_INSTALL|INSTALL_PATH|TARGET_BUILD_DIR' "$build_settings" >&2 || true
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*EXPORTED_SYMBOLS_FILE = .*/ios/MinecraftC[.]exports[[:space:]]*$' \
            "$build_settings"; then
            echo "MinecraftC app target is missing its exported-symbols file" >&2
            grep -E 'EXPORTED_SYMBOLS_FILE|OTHER_LDFLAGS' "$build_settings" >&2 || true
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*LD_EXPORT_SYMBOLS = YES[[:space:]]*$' \
            "$build_settings"; then
            echo "MinecraftC app target disables executable symbol exports" >&2
            grep -E 'EXPORTED_SYMBOLS_FILE|LD_EXPORT_SYMBOLS|OTHER_LDFLAGS' \
              "$build_settings" >&2 || true
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*STRIP_INSTALLED_PRODUCT = YES[[:space:]]*$' \
            "$build_settings"; then
            echo "MinecraftC Release app must remain stripped" >&2
            grep -E 'STRIP_INSTALLED_PRODUCT|STRIP_STYLE' "$build_settings" >&2 || true
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*STRIP_STYLE = non-global[[:space:]]*$' \
            "$build_settings"; then
            echo "MinecraftC Release app must preserve global symbols while stripping" >&2
            grep -E 'STRIP_INSTALLED_PRODUCT|STRIP_STYLE' "$build_settings" >&2 || true
            exit 1
          fi
          if ! grep -E '^[[:space:]]*OTHER_LDFLAGS = .*[-]u,_vkGetInstanceProcAddr' \
            "$build_settings" >/dev/null; then
            echo "MinecraftC app target is missing the MoltenVK force-load reference" >&2
            grep -E 'EXPORTED_SYMBOLS_FILE|OTHER_LDFLAGS' "$build_settings" >&2 || true
            exit 1
          fi
          if ! grep -E '^[[:space:]]*OTHER_LDFLAGS = .*[-]exported_symbol,_vkGetInstanceProcAddr' \
            "$build_settings" >/dev/null; then
            echo "MinecraftC app target is missing the explicit MoltenVK export" >&2
            grep -E 'EXPORTED_SYMBOLS_FILE|LD_EXPORT_SYMBOLS|OTHER_LDFLAGS' \
              "$build_settings" >&2 || true
            exit 1
          fi
          echo "MinecraftC exported-symbols file:"
          cat ios/MinecraftC.exports
          echo "MinecraftC export-related build settings:"
          grep -E 'DEAD_CODE_STRIPPING|EXPORTED_SYMBOLS_FILE|LD_EXPORT_SYMBOLS|OTHER_LDFLAGS|STRIP' \
            "$build_settings"
          moltenvk_device="$MINECRAFTC_MOLTENVK_ROOT/MoltenVK/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"
          nm -gU "$moltenvk_device" \
            > "$RUNNER_TEMP/minecraftc-ios-moltenvk-symbols.txt"
          if ! grep -q '_vkGetInstanceProcAddr$' \
            "$RUNNER_TEMP/minecraftc-ios-moltenvk-symbols.txt"; then
            echo "The pinned MoltenVK device archive does not define vkGetInstanceProcAddr" >&2
            exit 1
          fi
          xcodebuild -project build-ios-device/MinecraftC.xcodeproj \
            -scheme minecraftc -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" archive CODE_SIGNING_ALLOWED=NO
          app="$archive/Products/Applications/MinecraftC.app"
          if ! test -x "$app/MinecraftC"; then
            echo "Missing archived iOS executable: $app/MinecraftC" >&2
            echo "Archive products:" >&2
            find "$archive/Products" -maxdepth 4 -print >&2 || true
            echo "Uninstalled iOS app products:" >&2
            find build-ios-device -path '*/UninstalledProducts/iphoneos/*.app' \
              -print >&2 || true
            exit 1
          fi
          lipo "$app/MinecraftC" -verify_arch arm64
          xcrun vtool -show-build "$app/MinecraftC" \
            > "$RUNNER_TEMP/minecraftc-ios-device-platform.txt"
          if ! grep -Eq '^[[:space:]]*platform[[:space:]]+IOS[[:space:]]*$' \
            "$RUNNER_TEMP/minecraftc-ios-device-platform.txt"; then
            echo "Device executable is not marked for the iOS device platform" >&2
            cat "$RUNNER_TEMP/minecraftc-ios-device-platform.txt" >&2
            exit 1
          fi
          xcrun dyld_info -exports "$app/MinecraftC" \
            > "$RUNNER_TEMP/minecraftc-ios-device-exports.txt"
          grep -q '_vkGetInstanceProcAddr$' \
            "$RUNNER_TEMP/minecraftc-ios-device-exports.txt" || {
            echo "Static MoltenVK entry point is absent from the device dyld exports" >&2
            cat "$RUNNER_TEMP/minecraftc-ios-device-exports.txt" >&2
            echo "Final minecraftc LinkFileList inputs:" >&2
            find build-ios-device -path '*minecraftc.build*' \
              -name '*.LinkFileList' -print -exec cat {} \; >&2 || true
            echo "Final minecraftc linker build settings:" >&2
            grep -E 'DEAD_CODE_STRIPPING|EXPORTED_SYMBOLS_FILE|LD_EXPORT_SYMBOLS|OTHER_LDFLAGS|STRIP' \
              "$build_settings" >&2 || true
            exit 1
          }
          otool -L "$app/MinecraftC" > "$RUNNER_TEMP/minecraftc-ios-device-libraries.txt"
          if grep -q 'OpenGLES.framework' "$RUNNER_TEMP/minecraftc-ios-device-libraries.txt"; then
            echo "Vulkan-only iOS device binary unexpectedly links OpenGLES.framework" >&2
            exit 1
          fi
          if test -d "$app/_CodeSignature" || test -f "$app/embedded.mobileprovision"; then
            echo "Unsigned iOS app unexpectedly contains signing data" >&2
            exit 1
          fi
          ipa_root="$RUNNER_TEMP/minecraftc-ios-ipa"
          ipa="$RUNNER_TEMP/MinecraftC-$MINECRAFTC_VERSION-ios-arm64-unsigned.ipa"
          mkdir -p "$ipa_root/Payload"
          ditto "$app" "$ipa_root/Payload/MinecraftC.app"
          ditto -c -k --keepParent \
            "$ipa_root/Payload" "$ipa"
          unzip -tq "$ipa"
          unzip -Z1 "$ipa" > "$RUNNER_TEMP/minecraftc-ios-ipa-files.txt"
          grep -Fxq 'Payload/MinecraftC.app/MinecraftC' \
            "$RUNNER_TEMP/minecraftc-ios-ipa-files.txt"
          if grep -Evq '^Payload(/|$)' "$RUNNER_TEMP/minecraftc-ios-ipa-files.txt"; then
            echo "Unsigned IPA contains files outside its Payload directory" >&2
            exit 1
          fi
          if grep -Eq '^Payload/MinecraftC[.]app/(_CodeSignature/|embedded[.]mobileprovision$)' \
            "$RUNNER_TEMP/minecraftc-ios-ipa-files.txt"; then
            echo "Unsigned IPA unexpectedly contains signing data" >&2
            exit 1
          fi
          packaged_binary="$RUNNER_TEMP/minecraftc-ios-ipa-binary"
          unzip -p "$ipa" Payload/MinecraftC.app/MinecraftC > "$packaged_binary"
          cmp "$app/MinecraftC" "$packaged_binary"
          xcrun vtool -show-build "$packaged_binary" \
            > "$RUNNER_TEMP/minecraftc-ios-ipa-platform.txt"
          if ! grep -Eq '^[[:space:]]*platform[[:space:]]+IOS[[:space:]]*$' \
            "$RUNNER_TEMP/minecraftc-ios-ipa-platform.txt"; then
            echo "Packaged IPA contains a non-device executable" >&2
            cat "$RUNNER_TEMP/minecraftc-ios-ipa-platform.txt" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            build-ios-simulator/Release-iphonesimulator/MinecraftC.app \
            "$RUNNER_TEMP/MinecraftC-$MINECRAFTC_VERSION-ios-simulator-arm64.zip"
      - name: Upload unsigned iOS device IPA
        uses: actions/upload-artifact@v7
        with:
          name: minecraftc-ios-device-arm64
          path: ${{ runner.temp }}/MinecraftC-${{ env.MINECRAFTC_VERSION }}-ios-arm64-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload iOS Simulator package
        uses: actions/upload-artifact@v7
        with:
          name: minecraftc-ios-simulator-arm64
          path: ${{ runner.temp }}/MinecraftC-${{ env.MINECRAFTC_VERSION }}-ios-simulator-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  android-arm64:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Read project version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(alpha|beta|rc|release)$ ]]
          echo "MINECRAFTC_VERSION=$version" >> "$GITHUB_ENV"
          echo "MINECRAFTC_VERSION_CORE=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up pinned Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            cmake;3.22.1
            ndk;28.2.13676358
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build unsigned Android release APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Verify Android release APK
        run: |
          source_apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          release_apk="$RUNNER_TEMP/MinecraftC-$MINECRAFTC_VERSION-android-arm64-unsigned.apk"
          IFS=. read -r version_major version_minor version_patch <<< "$MINECRAFTC_VERSION_CORE"
          channel="${MINECRAFTC_VERSION##*-}"
          case "$channel" in alpha) channel_code=1;; beta) channel_code=2;; rc) channel_code=3;; release) channel_code=4;; esac
          version_code=$(((version_major * 10000 + version_minor * 100 + version_patch) * 10 + channel_code))
          test -f "$source_apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$source_apk" > "$RUNNER_TEMP/android-badging.txt"
          grep -q "package: name='io.github.SafeFain.MinecraftC' versionCode='$version_code' versionName='$MINECRAFTC_VERSION'" "$RUNNER_TEMP/android-badging.txt"
          grep -q "^application:.*icon='" "$RUNNER_TEMP/android-badging.txt"
          grep -q "sdkVersion:'29'" "$RUNNER_TEMP/android-badging.txt"
          grep -q "targetSdkVersion:'35'" "$RUNNER_TEMP/android-badging.txt"
          ! grep -q "uses-gl-es:" "$RUNNER_TEMP/android-badging.txt"
          grep -q "uses-feature: name='android.hardware.vulkan.version'" \
            "$RUNNER_TEMP/android-badging.txt"
          grep -q "native-code: 'arm64-v8a'" "$RUNNER_TEMP/android-badging.txt"
          unzip -Z1 "$source_apk" > "$RUNNER_TEMP/android-apk-files.txt"
          grep -Fxq 'assets/LICENSE' "$RUNNER_TEMP/android-apk-files.txt"
          unzip -p "$source_apk" lib/arm64-v8a/libmain.so \
            > "$RUNNER_TEMP/libmain.so"
          "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -D "$RUNNER_TEMP/libmain.so" | grep -q ' T SDL_main$'
          ! "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -d "$RUNNER_TEMP/libmain.so" | grep -E 'lib(GLES|EGL)'
          cp "$source_apk" "$release_apk"
      - name: Upload unsigned Android package
        uses: actions/upload-artifact@v7
        with:
          name: minecraftc-android-arm64
          path: ${{ runner.temp }}/MinecraftC-${{ env.MINECRAFTC_VERSION }}-android-arm64-unsigned.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, windows, macos-universal, ios-arm64, android-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: minecraftc-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cd release-assets
          sha256sum MinecraftC-* > SHA256SUMS
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" * --repo "$GITHUB_REPOSITORY" --clobber
            if [[ "$PRERELEASE" == true ]]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease
            else
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --prerelease=false --latest
            fi
          elif [[ "$PRERELEASE" == true ]]; then
            gh release create "$RELEASE_TAG" * --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --prerelease \
              --title "MinecraftC $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" * --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --latest \
              --title "MinecraftC $RELEASE_TAG"
          fi
