name: Cross-platform build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Read project version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "MINECRAFTC_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=MinecraftC-$version" >> "$GITHUB_ENV"
      - name: Install graphics and virtual-display dependencies
        run: sudo apt-get update && sudo apt-get install -y glslc libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers xorg-dev xvfb libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules
      - name: Configure
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DMINECRAFTC_FETCH_DEPENDENCIES=ON -DMINECRAFTC_ENABLE_VULKAN=ON -DMINECRAFTC_PORTABLE_LAYOUT=ON -DCMAKE_INSTALL_MESSAGE=NEVER
      - name: Build
        run: cmake --build build-ci -j2
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure
      - name: Verify checked-in Vulkan shaders
        run: python3 tools/vulkan_shaders.py --root . --check
      - name: Install
        run: cmake --install build-ci --prefix "$RUNNER_TEMP/$RELEASE_DIR"
      - name: Verify installed assets
        run: |
          test -f "$RUNNER_TEMP/$RELEASE_DIR/LICENSE"
          test -f "$RUNNER_TEMP/$RELEASE_DIR/assets/textures/generated/atlas.json"
          test -f "$RUNNER_TEMP/$RELEASE_DIR/assets/textures/generated/items_atlas.png"
          test -f "$RUNNER_TEMP/$RELEASE_DIR/assets/textures/generated/cloud.png"
          test "$($RUNNER_TEMP/$RELEASE_DIR/minecraftc --version)" = "MinecraftC Release-$MINECRAFTC_VERSION"
      - name: Verify installed OpenGL startup
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          set +e
          timeout 8s xvfb-run -a "$RUNNER_TEMP/$RELEASE_DIR/minecraftc" > minecraftc-smoke.log 2>&1
          status=$?
          set -e
          cat minecraftc-smoke.log
          grep -q "MinecraftC initialized" minecraftc-smoke.log
          test "$status" -eq 124
      - name: Verify installed Vulkan gameplay startup
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          set +e
          timeout 8s xvfb-run -a "$RUNNER_TEMP/$RELEASE_DIR/minecraftc" --renderer=vulkan > minecraftc-vulkan-smoke.log 2>&1
          status=$?
          set -e
          cat minecraftc-vulkan-smoke.log
          grep -q "Vulkan first frame presented" minecraftc-vulkan-smoke.log
          test "$status" -eq 124
      - name: Verify installed OpenGL basic rendering
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          set +e
          timeout 8s xvfb-run -a "$RUNNER_TEMP/$RELEASE_DIR/minecraftc" --renderer=opengl-demo > minecraftc-opengl-demo-smoke.log 2>&1
          status=$?
          set -e
          cat minecraftc-opengl-demo-smoke.log
          grep -q "Visual pipeline" minecraftc-opengl-demo-smoke.log
          test "$status" -eq 124
      - name: Package Linux release
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/MinecraftC-$MINECRAFTC_VERSION-linux-x86_64.tar.gz" "$RELEASE_DIR"
      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: minecraftc-linux-x86_64
          path: ${{ runner.temp }}/MinecraftC-${{ env.MINECRAFTC_VERSION }}-linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Read project version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid VERSION: $version"
          }
          "MINECRAFTC_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_DIR=MinecraftC-$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Reject Windows OpenGL-only configuration
        shell: pwsh
        run: |
          cmake -S . -B build-opengl-only -DMINECRAFTC_ENABLE_VULKAN=OFF
          if ($LASTEXITCODE -eq 0) {
            throw "Windows unexpectedly accepted an OpenGL-only build"
          }
          Write-Host "Windows OpenGL-only configuration was rejected as expected"
          exit 0
      - name: Install pinned Vulkan SDK
        shell: pwsh
        run: |
          $version = "1.4.350.0"
          $expected = "855b27ba05d2d8119c5114c5d4ff870ca38f2c632b11e1bb9923b9b7e6ecfe7b"
          $installer = "$env:RUNNER_TEMP/vulkan_sdk.exe"
          $sdk = "$env:RUNNER_TEMP/VulkanSDK/$version"
          Invoke-WebRequest `
            -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe" `
            -OutFile $installer
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Vulkan SDK checksum mismatch: $actual"
          }
          & $installer --root $sdk --accept-licenses --default-answer `
            --confirm-command install copy_only=1
          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK installation failed with exit code $LASTEXITCODE"
          }
          if (!(Test-Path "$sdk/Include/vulkan/vulkan.h") -or
              !(Test-Path "$sdk/Lib/vulkan-1.lib")) {
            throw "Vulkan SDK headers or import library are missing"
          }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdk/Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Configure
        run: cmake -S . -B build-ci -DMINECRAFTC_FETCH_DEPENDENCIES=ON -DMINECRAFTC_ENABLE_VULKAN=ON -DMINECRAFTC_PORTABLE_LAYOUT=ON -DMINECRAFTC_STATIC_MSVC_RUNTIME=ON -DCMAKE_INSTALL_MESSAGE=NEVER
      - name: Build
        run: cmake --build build-ci --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build-ci -C Release --output-on-failure
      - name: Verify checked-in Vulkan shaders
        run: python tools/vulkan_shaders.py --root . --check
      - name: Install and verify layout
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/$env:RELEASE_DIR"
          cmake --install build-ci --config Release --prefix $stage
          if (!(Test-Path "$stage/minecraftc.exe")) { throw "Executable was not installed" }
          if (!(Test-Path "$stage/LICENSE")) { throw "GPL license was not installed" }
          if (!(Test-Path "$stage/assets/shaders/block.vert")) { throw "Assets were not installed" }
          if (!(Test-Path "$stage/assets/textures/generated/atlas.json")) { throw "Block atlas was not installed" }
          $version = & "$stage/minecraftc.exe" --version
          if ($version -ne "MinecraftC Release-$env:MINECRAFTC_VERSION") { throw "Version check failed: $version" }
          $help = (& "$stage/minecraftc.exe" --help 2>&1) -join "`n"
          if ($help -notmatch "renderer=opengl\|vulkan") {
            throw "Installed Windows executable does not advertise both renderers"
          }
      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path "$env:RUNNER_TEMP/$env:RELEASE_DIR" -DestinationPath "$env:RUNNER_TEMP/MinecraftC-$env:MINECRAFTC_VERSION-windows-x86_64.zip"
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: minecraftc-windows-x86_64
          path: ${{ runner.temp }}/MinecraftC-${{ env.MINECRAFTC_VERSION }}-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos-universal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Read project version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "MINECRAFTC_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=MinecraftC-$version" >> "$GITHUB_ENV"
      - name: Configure universal build
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DMINECRAFTC_FETCH_DEPENDENCIES=ON -DMINECRAFTC_PORTABLE_LAYOUT=ON -DCMAKE_INSTALL_MESSAGE=NEVER '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Build
        run: cmake --build build-ci -j2
      - name: Test native slice
        run: ctest --test-dir build-ci --output-on-failure
      - name: Install and verify universal executable
        run: |
          cmake --install build-ci --prefix "$RUNNER_TEMP/$RELEASE_DIR"
          lipo "$RUNNER_TEMP/$RELEASE_DIR/minecraftc" -verify_arch arm64 x86_64
          test -f "$RUNNER_TEMP/$RELEASE_DIR/LICENSE"
          test -f "$RUNNER_TEMP/$RELEASE_DIR/assets/shaders/block.vert"
          test "$($RUNNER_TEMP/$RELEASE_DIR/minecraftc --version)" = "MinecraftC Release-$MINECRAFTC_VERSION"
      - name: Package macOS release
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/MinecraftC-$MINECRAFTC_VERSION-macos-universal.tar.gz" "$RELEASE_DIR"
      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: minecraftc-macos-universal
          path: ${{ runner.temp }}/MinecraftC-${{ env.MINECRAFTC_VERSION }}-macos-universal.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Read project version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "MINECRAFTC_VERSION=$version" >> "$GITHUB_ENV"
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up pinned Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            cmake;3.22.1
            ndk;28.2.13676358
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Reject Android OpenGL-only configuration
        shell: bash
        run: |
          set +e
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" \
            -S . -B "$RUNNER_TEMP/android-opengl-only" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DMINECRAFTC_ENABLE_VULKAN=OFF \
            > "$RUNNER_TEMP/android-opengl-only.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/android-opengl-only.log"
          test "$status" -ne 0
          grep -q "Android, Linux, and Windows builds require both" \
            "$RUNNER_TEMP/android-opengl-only.log"
      - name: Build unsigned Android release APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Verify Android release APK
        run: |
          source_apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          release_apk="$RUNNER_TEMP/MinecraftC-$MINECRAFTC_VERSION-android-arm64-unsigned.apk"
          IFS=. read -r version_major version_minor version_patch <<< "$MINECRAFTC_VERSION"
          version_code=$((version_major * 10000 + version_minor * 100 + version_patch))
          test -f "$source_apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$source_apk" > "$RUNNER_TEMP/android-badging.txt"
          grep -q "package: name='io.github.SafeFain.MinecraftC' versionCode='$version_code' versionName='$MINECRAFTC_VERSION'" "$RUNNER_TEMP/android-badging.txt"
          grep -q "sdkVersion:'29'" "$RUNNER_TEMP/android-badging.txt"
          grep -q "targetSdkVersion:'35'" "$RUNNER_TEMP/android-badging.txt"
          grep -q "uses-gl-es: '0x30000'" "$RUNNER_TEMP/android-badging.txt"
          grep -q "uses-feature-not-required: name='android.hardware.vulkan.version'" \
            "$RUNNER_TEMP/android-badging.txt"
          grep -q "native-code: 'arm64-v8a'" "$RUNNER_TEMP/android-badging.txt"
          unzip -Z1 "$source_apk" > "$RUNNER_TEMP/android-apk-files.txt"
          grep -Fxq 'assets/LICENSE' "$RUNNER_TEMP/android-apk-files.txt"
          unzip -p "$source_apk" lib/arm64-v8a/libmain.so \
            > "$RUNNER_TEMP/libmain.so"
          "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -D "$RUNNER_TEMP/libmain.so" | grep -q ' T SDL_main$'
          cp "$source_apk" "$release_apk"
      - name: Upload unsigned Android package
        uses: actions/upload-artifact@v7
        with:
          name: minecraftc-android-arm64
          path: ${{ runner.temp }}/MinecraftC-${{ env.MINECRAFTC_VERSION }}-android-arm64-unsigned.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos-universal, android-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: minecraftc-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum MinecraftC-* > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "MinecraftC $GITHUB_REF_NAME"
          fi
