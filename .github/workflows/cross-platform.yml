name: Cross-platform build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install OpenGL and virtual-display dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev xvfb libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules
      - name: Configure
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DMINECRAFTC_FETCH_DEPENDENCIES=ON -DCMAKE_INSTALL_MESSAGE=NEVER
      - name: Build
        run: cmake --build build-ci -j2
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure
      - name: Install
        run: cmake --install build-ci --prefix "$RUNNER_TEMP/minecraftc-stage"
      - name: Verify installed assets
        run: |
          test -f "$RUNNER_TEMP/minecraftc-stage/share/minecraftc/assets/textures/generated/atlas.json"
          test -f "$RUNNER_TEMP/minecraftc-stage/share/minecraftc/assets/textures/generated/items_atlas.png"
          test -f "$RUNNER_TEMP/minecraftc-stage/share/minecraftc/assets/textures/generated/cloud.png"
      - name: Verify installed OpenGL startup
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          set +e
          timeout 8s xvfb-run -a "$RUNNER_TEMP/minecraftc-stage/bin/minecraftc" > minecraftc-smoke.log 2>&1
          status=$?
          set -e
          cat minecraftc-smoke.log
          grep -q "MinecraftC initialized" minecraftc-smoke.log
          test "$status" -eq 124
      - name: Package Linux release
        run: tar -C "$RUNNER_TEMP/minecraftc-stage" -czf "$RUNNER_TEMP/minecraftc-linux-x86_64.tar.gz" .
      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: minecraftc-linux-x86_64
          path: ${{ runner.temp }}/minecraftc-linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build-ci -DMINECRAFTC_FETCH_DEPENDENCIES=ON -DCMAKE_INSTALL_MESSAGE=NEVER
      - name: Build
        run: cmake --build build-ci --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build-ci -C Release --output-on-failure
      - name: Install and verify layout
        shell: pwsh
        run: |
          cmake --install build-ci --config Release --prefix "$env:RUNNER_TEMP/minecraftc-stage"
          if (!(Test-Path "$env:RUNNER_TEMP/minecraftc-stage/bin/minecraftc.exe")) { throw "Executable was not installed" }
          if (!(Test-Path "$env:RUNNER_TEMP/minecraftc-stage/share/minecraftc/assets/shaders/block.vert")) { throw "Assets were not installed" }
          if (!(Test-Path "$env:RUNNER_TEMP/minecraftc-stage/share/minecraftc/assets/textures/generated/atlas.json")) { throw "Block atlas was not installed" }
          if (!(Test-Path "$env:RUNNER_TEMP/minecraftc-stage/share/minecraftc/assets/textures/generated/items_atlas.png")) { throw "Item atlas was not installed" }
          if (!(Test-Path "$env:RUNNER_TEMP/minecraftc-stage/share/minecraftc/assets/textures/generated/cloud.png")) { throw "Cloud material was not installed" }
      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path "$env:RUNNER_TEMP/minecraftc-stage/*" -DestinationPath "$env:RUNNER_TEMP/minecraftc-windows-x86_64.zip"
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: minecraftc-windows-x86_64
          path: ${{ runner.temp }}/minecraftc-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos-universal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Configure universal build
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DMINECRAFTC_FETCH_DEPENDENCIES=ON -DCMAKE_INSTALL_MESSAGE=NEVER '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Build
        run: cmake --build build-ci -j2
      - name: Test native slice
        run: ctest --test-dir build-ci --output-on-failure
      - name: Install and verify universal executable
        run: |
          cmake --install build-ci --prefix "$RUNNER_TEMP/minecraftc-stage"
          lipo "$RUNNER_TEMP/minecraftc-stage/bin/minecraftc" -verify_arch arm64 x86_64
          test -f "$RUNNER_TEMP/minecraftc-stage/share/minecraftc/assets/shaders/block.vert"
          test -f "$RUNNER_TEMP/minecraftc-stage/share/minecraftc/assets/textures/generated/atlas.json"
          test -f "$RUNNER_TEMP/minecraftc-stage/share/minecraftc/assets/textures/generated/items_atlas.png"
          test -f "$RUNNER_TEMP/minecraftc-stage/share/minecraftc/assets/textures/generated/cloud.png"
      - name: Package macOS release
        run: tar -C "$RUNNER_TEMP/minecraftc-stage" -czf "$RUNNER_TEMP/minecraftc-macos-universal.tar.gz" .
      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: minecraftc-macos-universal
          path: ${{ runner.temp }}/minecraftc-macos-universal.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos-universal]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: minecraftc-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "MinecraftC $GITHUB_REF_NAME"
          fi
